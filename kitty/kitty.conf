# ~/.config/kitty/kitty.conf — "Miku" teal/pink theme

font_family           JetBrains Mono
font_size             12
background_opacity    0.85
window_padding_width  10
hide_window_decorations yes

# Colours
foreground            #E0F7F5
background            #0B1E24
cursor                #FF4FA3
selection_background  #39C5BB
selection_foreground  #0B1E24

# black / bright black
color0  #0B1E24
color8  #1F3A42
# red (pink)
color1  #FF4FA3
color9  #FF7BBD
# green (teal)
color2  #39C5BB
color10 #6FE3DA
# yellow
color3  #F5D76E
color11 #FFE69A
# blue
color4  #4DA3FF
color12 #7DBEFF
# magenta
color5  #C77DFF
color13 #DDA5FF
# cyan
color6  #39C5BB
color14 #8CF0E8
# white
color7  #E0F7F5
color15 #FFFFFF
